#ubuntu容器中编译
name: WRT-CONTAINER

on:
  workflow_call:
    inputs:
      WRT_CONF:
        description: '配置名 (Configs/目录下的子目录名)'
        default: 'x86'
        required: true
        type: string
      WRT_REPO:
        description: '源码仓库，留空则从 Configs/<WRT_CONF>/build.env 加载'
        default: ''
        required: false
        type: string
      WRT_BRANCH:
        description: '源码分支，留空则从 Configs/<WRT_CONF>/build.env 加载'
        default: ''
        required: false
        type: string
      WRT_COMMIT:
        description: '指定源码Commit (留空使用最新)'
        default: ''
        required: false
        type: string
      WRT_CACHE:
        description: '使用Cache'
        default: false
        required: false
        type: boolean
      WRT_TAGCONF:
        description: 'Tag使用的Conf'
        default: false
        required: false
        type: boolean
      WRT_TEST:
        description: '仅生成Conf'
        default: false
        required: false
        type: boolean
      PATH_MOUNT:
        default: '/volume_mnt'
        required: false
        type: string

  workflow_dispatch:
    inputs:
      WRT_CONF:
        description: '配置名 (Configs/目录下的子目录名)'
        default: 'x86'
        required: true
        type: string
      WRT_REPO:
        description: '源码仓库（留空则从 Configs/<WRT_CONF>/build.env 加载）'
        default: ''
        required: false
        type: string
      WRT_BRANCH:
        description: '源码分支（留空则从 Configs/<WRT_CONF>/build.env 加载）'
        default: ''
        required: false
        type: string
      WRT_COMMIT:
        description: '指定源码Commit (留空使用最新)'
        default: ''
        required: false
        type: string
      WRT_CACHE:
        description: '使用Cache'
        default: false
        required: true
        type: boolean
      WRT_TAGCONF:
        description: 'Tag使用的Conf'
        default: false
        required: true
        type: boolean
      WRT_TEST:
        description: '仅生成Conf'
        default: false
        required: true
        type: boolean
      PATH_MOUNT:
        default: '/volume_mnt'
        required: true
        type: string

env:
  PATH_MOUNT: ${{inputs.PATH_MOUNT}}
  PATH_WORKDIR: ${{inputs.PATH_MOUNT}}/work
  PATH_CI: ci
  PATH_SRC: opwrt_src

  WRT_CONF: ${{inputs.WRT_CONF}}
  WRT_TAGCONF: ${{inputs.WRT_TAGCONF}}
  WRT_REPO: ${{inputs.WRT_REPO}}
  WRT_BRANCH: ${{inputs.WRT_BRANCH}}
  WRT_COMMIT: ${{inputs.WRT_COMMIT}}
  WRT_TEST: ${{inputs.WRT_TEST}}
  WRT_CACHE: ${{inputs.WRT_CACHE}}

jobs:
  core:
    name: CONTAINER_${{inputs.WRT_CONF}}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    container:
      image: ubuntu:latest
      volumes:
        - /mnt:${{inputs.PATH_MOUNT}}
      options: --env TZ=Asia/Shanghai
    defaults:
      run:
        shell: su ubuntu -c "bash {0}"
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Initialize System
        shell: bash
        run: |
          echo "=====Initializing System====="
          apt -yqq update
          apt -yqq install tzdata sudo git dos2unix curl

          echo "Setting timezone to Asia/Shanghai..."
          ln -fs /usr/share/zoneinfo/Asia/Shanghai /etc/localtime
          dpkg-reconfigure --frontend noninteractive tzdata

          echo "Configuring ubuntu user..."
          passwd -d ubuntu

          echo "Setting up work directory..."
          if [ -d $PATH_WORKDIR ]; then
            echo "Removing existing work directory..."
            rm -rf $PATH_WORKDIR
          fi
          mkdir $PATH_WORKDIR
          chmod -R 775 $PATH_WORKDIR
          chown -R ubuntu $PATH_WORKDIR
          echo "System initialization completed!"

      - name: Container Information
        run: |
          echo "========================================"
          echo "         CONTAINER INFORMATION"
          echo "========================================"
          echo "CPU: $(nproc) cores | $(lscpu | grep 'Model name' | cut -d':' -f2 | xargs)"
          echo "Memory: $(free -h | awk 'NR==2{printf "%s total, %s available", $2, $7}')"
          echo "Disk: $(df -h / | awk 'NR==2{printf "%s used / %s total (%s)", $3, $2, $5}')"
          echo ""
          echo "Build Configuration:"
          echo "- Config:         $WRT_CONF"
          echo "- Repo (input):   ${WRT_REPO:-'(will load from build.env)'}"
          echo "- Branch (input): ${WRT_BRANCH:-'(will load from build.env)'}"
          echo "- Commit:         ${WRT_COMMIT:-'latest'}"
          echo "- Test Mode:      $WRT_TEST"
          echo "- Cache:          $WRT_CACHE"
          echo "- Time:           $(date -Iseconds)"
          echo "========================================"

      - name: Checkout CI Code
        uses: actions/checkout@v4
        with:
          path: ${{env.PATH_CI}}

      - name: Load Config Defaults
        shell: bash
        run: |
          echo "=====Loading Config Defaults====="
          CONF_DIR="$GITHUB_WORKSPACE/$PATH_CI/Configs/$WRT_CONF"
          BUILD_ENV="$CONF_DIR/build.env"

          # Validate config directory exists
          if [ ! -d "$CONF_DIR" ]; then
            echo "ERROR: Config directory not found: Configs/$WRT_CONF"
            echo "Available configs:"
            find "$GITHUB_WORKSPACE/$PATH_CI/Configs/" -maxdepth 1 -mindepth 1 -type d -printf '%f\n' 2>/dev/null || echo "  (none)"
            exit 1
          fi
          echo "Config directory found: Configs/$WRT_CONF"

          # Parse build.env for default repo/branch values
          CONF_REPO=""
          CONF_BRANCH=""
          if [ -f "$BUILD_ENV" ]; then
            while IFS='=' read -r key value || [ -n "$key" ]; do
              key="${key%%#*}"
              key="${key// /}"
              [[ -z "$key" ]] && continue
              value="${value%%#*}"
              value="${value#"${value%%[![:space:]]*}"}"
              value="${value%"${value##*[![:space:]]}"}"
              case "$key" in
                WRT_REPO)   CONF_REPO="$value" ;;
                WRT_BRANCH) CONF_BRANCH="$value" ;;
              esac
            done < "$BUILD_ENV"
            echo "Loaded build.env: repo=${CONF_REPO}, branch=${CONF_BRANCH}"
          else
            echo "No build.env found in Configs/$WRT_CONF"
          fi

          # Effective values: workflow input takes priority over build.env defaults
          FINAL_REPO="${WRT_REPO:-${CONF_REPO}}"
          FINAL_BRANCH="${WRT_BRANCH:-${CONF_BRANCH}}"

          # Validate we have required values
          if [ -z "$FINAL_REPO" ]; then
            echo "ERROR: WRT_REPO not set. Provide it via workflow input or add WRT_REPO to Configs/$WRT_CONF/build.env"
            exit 1
          fi
          if [ -z "$FINAL_BRANCH" ]; then
            echo "ERROR: WRT_BRANCH not set. Provide it via workflow input or add WRT_BRANCH to Configs/$WRT_CONF/build.env"
            exit 1
          fi

          echo "WRT_REPO=$FINAL_REPO"     >> $GITHUB_ENV
          echo "WRT_BRANCH=$FINAL_BRANCH" >> $GITHUB_ENV
          echo "Effective repo:   $FINAL_REPO"
          echo "Effective branch: $FINAL_BRANCH"

      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          repository: ${{env.WRT_REPO}}
          ref: ${{env.WRT_BRANCH}}
          path: ${{env.PATH_SRC}}
          fetch-depth: 0

      - name: Initialize Values
        shell: bash
        run: |
          echo "=====Initializing Build Values====="
          if [ $WRT_TAGCONF == true ]; then
            export WRT_TAG=$WRT_CONF'_'$(date -Iseconds)
            echo "Using configuration-based tag: $WRT_TAG"
          else
            export WRT_TAG='build_'$(date -Iseconds)
            echo "Using build-based tag: $WRT_TAG"
          fi
          echo "WRT_TAG=$WRT_TAG" >> $GITHUB_ENV

          export F_DATE=$(date +"%y%m%dT%H%M%S")
          export WRT_VER=$(echo $WRT_REPO | sed 's/\//-/g')'_'$WRT_BRANCH
          echo "F_DATE=$F_DATE"   >> $GITHUB_ENV
          echo "WRT_VER=$WRT_VER" >> $GITHUB_ENV
          echo "Build date:     $F_DATE"
          echo "Version string: $WRT_VER"

      - name: Check and Switch Source Code
        shell: bash
        run: |
          echo "=====Checking and Switching Source Code====="
          cd $GITHUB_WORKSPACE/$PATH_SRC

          echo "Current branch: $(git branch --show-current)"
          echo "Latest commit:  $(git log -1 --pretty=format:'%h - %s (%an, %ar)')"

          if [ -n "$WRT_COMMIT" ]; then
            echo "Switching to specified commit: $WRT_COMMIT"
            if git cat-file -e "$WRT_COMMIT^{commit}" 2>/dev/null; then
              git checkout "$WRT_COMMIT"
              echo "Successfully switched to commit: $WRT_COMMIT"
            else
              echo "ERROR: Commit '$WRT_COMMIT' not found in repository"
              echo "Available recent commits:"
              git log --oneline -10
              exit 1
            fi
          else
            echo "Using latest commit on branch $WRT_BRANCH"
          fi

          HASH=$(git log -1 --pretty=format:'%h')
          FULL_HASH=$(git log -1 --pretty=format:'%H')
          echo "WRT_HASH=$HASH"           >> $GITHUB_ENV
          echo "WRT_FULL_HASH=$FULL_HASH" >> $GITHUB_ENV

          echo ""
          echo "=== Final Source Code Information ==="
          echo "Commit:  $HASH ($FULL_HASH)"
          echo "Message: $(git log -1 --pretty=format:'%s')"
          echo "Author:  $(git log -1 --pretty=format:'%an <%ae>')"
          echo "Date:    $(git log -1 --pretty=format:'%cd')"
          echo "====================================="

      - name: Prepare Source Code
        run: |
          echo "=====Preparing Source Code====="
          cp -r $GITHUB_WORKSPACE/$PATH_CI $PATH_WORKDIR/$PATH_CI
          cp -r $GITHUB_WORKSPACE/$PATH_SRC $PATH_WORKDIR/$PATH_SRC

          echo "Cleaning up GitHub workspace..."
          sudo rm -rf $GITHUB_WORKSPACE/$PATH_CI
          sudo rm -rf $GITHUB_WORKSPACE/$PATH_SRC

          echo "Setting file permissions..."
          find $PATH_WORKDIR/$PATH_CI -type f -iregex '.*(txt|sh)$' -exec dos2unix {} \; -exec chmod 777 {} \;
          echo "Source code preparation completed!"

      # ── Hook 1: After code clone ─────────────────────────────────────────
      - name: Hook - After Clone
        run: |
          echo "=====Hook: After Clone====="
          HOOK="$PATH_WORKDIR/$PATH_CI/Configs/$WRT_CONF/hooks/01_after_clone.sh"
          if [ -f "$HOOK" ]; then
            echo "Running 01_after_clone.sh ..."
            cd $PATH_WORKDIR/$PATH_SRC
            bash "$HOOK"
            echo "01_after_clone.sh completed!"
          else
            echo "No 01_after_clone.sh found (skipping)"
          fi

      - name: Initialize Build Environment
        run: |
          echo "=====Initializing Build Environment====="
          sudo apt -yqq full-upgrade
          sudo apt -yqq autoremove --purge
          sudo apt -yqq autoclean
          sudo apt -yqq clean

          echo "Installing ImmortalWrt build environment..."
          sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          echo "Build environment initialized!"

      - name: Generate Cache Key
        if: ${{ env.WRT_CACHE == 'true' }}
        shell: bash
        run: |
          echo "=====Generating Cache Key====="
          cd $PATH_WORKDIR/$PATH_SRC

          CONFIG_FILE="$PATH_WORKDIR/$PATH_CI/Configs/$WRT_CONF/config.txt"
          if [ ! -f "$CONFIG_FILE" ]; then
            CONFIG_FILE="$PATH_WORKDIR/$PATH_CI/Simple/Config/$WRT_CONF.txt"
          fi
          CONFIG_HASH=$(sha256sum "$CONFIG_FILE" 2>/dev/null | cut -d' ' -f1 | cut -c1-8 || echo "00000000")

          CACHE_KEY="${WRT_VER}-${WRT_CONF}-${WRT_HASH}-${CONFIG_HASH}"
          echo "CACHE_KEY=$CACHE_KEY" >> $GITHUB_ENV

          echo "Cache key:   $CACHE_KEY"
          echo "- Version:   $WRT_VER"
          echo "- Config:    $WRT_CONF"
          echo "- Commit:    $WRT_HASH"
          echo "- Conf hash: $CONFIG_HASH"

      - name: Check Caches
        id: check-cache
        if: ${{ env.WRT_TEST != 'true' && env.WRT_CACHE == 'true' }}
        uses: actions/cache@v4
        with:
          key: ${{env.CACHE_KEY}}
          restore-keys: |
            ${{env.WRT_VER}}-${{env.WRT_CONF}}-${{env.WRT_HASH}}-
            ${{env.WRT_VER}}-${{env.WRT_CONF}}-
          path: |
            ${{env.PATH_WORKDIR}}/${{env.PATH_SRC}}/.ccache
            ${{env.PATH_WORKDIR}}/${{env.PATH_SRC}}/staging_dir/host*
            ${{env.PATH_WORKDIR}}/${{env.PATH_SRC}}/staging_dir/tool*
            ${{env.PATH_WORKDIR}}/${{env.PATH_SRC}}/staging_dir/target-*

      - name: Configure Build Cache
        if: ${{ env.WRT_TEST != 'true' && env.WRT_CACHE == 'true' }}
        shell: bash
        run: |
          echo "=====Configuring Build Cache====="
          cd $PATH_WORKDIR/$PATH_SRC

          export CCACHE_DIR="$PWD/.ccache"
          export CCACHE_COMPRESS="1"
          echo "CCACHE_DIR=$CCACHE_DIR"           >> $GITHUB_ENV
          echo "CCACHE_COMPRESS=$CCACHE_COMPRESS" >> $GITHUB_ENV

          if [ "${{ steps.check-cache.outputs.cache-hit }}" = "true" ]; then
            echo "Cache hit! Using optimized build strategy."
            echo "BUILD_STRATEGY=fast" >> $GITHUB_ENV
            ccache -s 2>/dev/null || echo "ccache statistics not available yet"
          else
            echo "Cache miss. Using standard build strategy."
            echo "BUILD_STRATEGY=standard" >> $GITHUB_ENV

            if [ "${{ github.event_name }}" = "schedule" ]; then
              echo "Scheduled build: cleaning up old caches..."
              export GH_TOKEN="${{ github.token }}"
              gh extension install actions/gh-actions-cache 2>/dev/null || true

              CACHE_LIST=$(gh actions-cache list --key "${{env.WRT_VER}}-${{env.WRT_CONF}}" --repo "${{ github.repository }}" --limit 10 2>/dev/null | tail -n +4 | cut -f 1 || echo "")
              for CACHE_KEY_TO_DELETE in $CACHE_LIST; do
                gh actions-cache delete "$CACHE_KEY_TO_DELETE" --repo "${{ github.repository }}" --confirm 2>/dev/null || true
              done
            fi
          fi

      - name: Add Custom Feeds
        run: |
          echo "=====Adding Custom Feeds====="
          cd $PATH_WORKDIR/$PATH_SRC

          FEEDS_FILE="$PATH_WORKDIR/$PATH_CI/Configs/$WRT_CONF/feeds.txt"
          if [ -f "$FEEDS_FILE" ]; then
            echo "Loading feeds from Configs/$WRT_CONF/feeds.txt ..."
            cat "$FEEDS_FILE" >> feeds.conf.default
          elif [ -f "$PATH_WORKDIR/$PATH_CI/Simple/Feeds/$WRT_CONF.txt" ]; then
            echo "Loading feeds from Simple/Feeds/$WRT_CONF.txt (fallback) ..."
            cat "$PATH_WORKDIR/$PATH_CI/Simple/Feeds/$WRT_CONF.txt" >> feeds.conf.default
          else
            echo "No custom feeds file found (skipping)"
          fi

          echo "Current feeds configuration:"
          cat feeds.conf.default

      # ── Hook 2: After adding feeds, before update ─────────────────────────
      - name: Hook - Before Feeds Update
        run: |
          echo "=====Hook: Before Feeds Update====="
          HOOK="$PATH_WORKDIR/$PATH_CI/Configs/$WRT_CONF/hooks/02_before_feeds_update.sh"
          if [ -f "$HOOK" ]; then
            echo "Running 02_before_feeds_update.sh ..."
            cd $PATH_WORKDIR/$PATH_SRC
            bash "$HOOK"
            echo "02_before_feeds_update.sh completed!"
          else
            echo "No 02_before_feeds_update.sh found (skipping)"
          fi

      - name: Update Feeds
        run: |
          echo "=====Updating Feeds====="
          cd $PATH_WORKDIR/$PATH_SRC
          ./scripts/feeds update -a
          echo "Feeds update completed!"

      # ── Hook 3: After update, before install ─────────────────────────────
      - name: Hook - After Feeds Update
        run: |
          echo "=====Hook: After Feeds Update====="
          HOOK="$PATH_WORKDIR/$PATH_CI/Configs/$WRT_CONF/hooks/03_after_feeds_update.sh"
          if [ -f "$HOOK" ]; then
            echo "Running 03_after_feeds_update.sh ..."
            cd $PATH_WORKDIR/$PATH_SRC
            bash "$HOOK"
            echo "03_after_feeds_update.sh completed!"
          else
            echo "No 03_after_feeds_update.sh found (skipping)"
          fi

      - name: Install Feeds
        run: |
          echo "=====Installing Feeds====="
          cd $PATH_WORKDIR/$PATH_SRC
          ./scripts/feeds install -a
          echo "Feeds install completed!"

      # ── Hook 4: After install ─────────────────────────────────────────────
      - name: Hook - After Feeds Install
        run: |
          echo "=====Hook: After Feeds Install====="
          HOOK="$PATH_WORKDIR/$PATH_CI/Configs/$WRT_CONF/hooks/04_after_feeds_install.sh"
          if [ -f "$HOOK" ]; then
            echo "Running 04_after_feeds_install.sh ..."
            cd $PATH_WORKDIR/$PATH_SRC/package/
            bash "$HOOK"
            echo "04_after_feeds_install.sh completed!"
          else
            echo "No 04_after_feeds_install.sh found (skipping)"
          fi

      - name: Apply Config
        run: |
          echo "=====Applying Config====="
          cd $PATH_WORKDIR/$PATH_SRC

          rm -rf ./tmp* ./.config*

          CONFIG_FILE="$PATH_WORKDIR/$PATH_CI/Configs/$WRT_CONF/config.txt"
          if [ -f "$CONFIG_FILE" ]; then
            echo "Applying config from Configs/$WRT_CONF/config.txt ..."
            cat "$CONFIG_FILE" >> .config
          elif [ -f "$PATH_WORKDIR/$PATH_CI/Simple/Config/$WRT_CONF.txt" ]; then
            echo "Applying config from Simple/Config/$WRT_CONF.txt (fallback) ..."
            cat "$PATH_WORKDIR/$PATH_CI/Simple/Config/$WRT_CONF.txt" >> .config
          else
            echo "No config file found for '$WRT_CONF', using default config"
          fi

          echo "Generating default configuration..."
          make -j $(($(nproc)+1)) defconfig V=sc
          echo "Config applied!"

      # ── Hook 5: Before compilation starts ────────────────────────────────
      - name: Hook - Before Compile
        run: |
          echo "=====Hook: Before Compile====="
          HOOK="$PATH_WORKDIR/$PATH_CI/Configs/$WRT_CONF/hooks/05_before_compile.sh"
          if [ -f "$HOOK" ]; then
            echo "Running 05_before_compile.sh ..."
            cd $PATH_WORKDIR/$PATH_SRC
            bash "$HOOK"
            echo "05_before_compile.sh completed!"
          else
            echo "No 05_before_compile.sh found (skipping)"
          fi

      - name: Download Packages
        if: env.WRT_TEST != 'true'
        run: |
          echo "=====Downloading Packages====="
          cd $PATH_WORKDIR/$PATH_SRC
          make -j $(($(nproc)+1)) download V=w
          echo "Package download completed!"

      - name: Compile Firmware (Adaptive)
        if: env.WRT_TEST != 'true'
        id: compile
        continue-on-error: true
        run: |
          echo "=====Compiling Firmware ($BUILD_STRATEGY mode)====="
          echo "$CCACHE_DIR"
          echo "$CCACHE_COMPRESS"
          cd $PATH_WORKDIR/$PATH_SRC
          echo "Compilation started at: $(date -Iseconds)"

          if [ "$BUILD_STRATEGY" = "fast" ]; then
            echo "Fast compilation with cache"
            make -j $(($(nproc)+1)) V=w
          else
            echo "Standard compilation"
            make -j $(($(nproc)+1)) V=w
          fi

      - name: Compile Firmware (Single-threaded for Error Analysis)
        if: env.WRT_TEST != 'true' && steps.compile.outcome == 'failure'
        run: |
          echo "=====Compiling Firmware (Single-threaded for Error Analysis)====="
          cd $PATH_WORKDIR/$PATH_SRC
          echo "Multi-threaded compilation failed, starting single-threaded compilation for detailed error analysis..."
          make -j 1 V=sc

      - name: Check Compilation Result
        if: env.WRT_TEST != 'true'
        run: |
          echo "=====Checking Compilation Result====="
          cd $PATH_WORKDIR/$PATH_SRC

          if [ "${{ steps.compile.outcome }}" = "success" ]; then
            echo "Multi-threaded compilation completed successfully!"
          elif [ "${{ steps.compile.outcome }}" = "failure" ]; then
            echo "Multi-threaded compilation failed, single-threaded may have succeeded."

            if find ./bin/targets/ -name "*.bin" -o -name "*.img" -o -name "*.tar" 2>/dev/null | grep -q .; then
              echo "Single-threaded compilation produced firmware files."
            else
              echo "ERROR: Single-threaded compilation also failed - no firmware files found."
              echo "::warning::Compilation completed with errors - please check logs for details"
              exit 1
            fi
          fi

      - name: Package Firmware
        run: |
          echo "=====Packaging Firmware====="
          cd $PATH_WORKDIR/$PATH_SRC && mkdir ./upload

          cp -f ./.config ./upload/config_"$WRT_VER"_"$WRT_CONF"_"$F_DATE".txt

          if [[ $WRT_TEST != 'true' ]]; then
            find ./bin/targets/ -iregex ".*\(json\|manifest\|packages\)$" -exec rm -rf {} +
            find ./bin/targets/ -type f -exec mv -f {} ./upload/ \;
            echo "Firmware files:"
            ls -la ./upload/
          else
            echo "Test mode: only configuration file will be uploaded."
          fi
          echo "Packaging completed!"

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: ${{env.WRT_VER}}_${{env.WRT_CONF}}_${{env.F_DATE}}${{env.WRT_COMMIT != '' && format('_commit-{0}', env.WRT_HASH) || ''}}
          path: ${{env.PATH_WORKDIR}}/${{env.PATH_SRC}}/upload/*
          if-no-files-found: error
