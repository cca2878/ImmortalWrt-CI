#ubuntu容器中编译
name: WRT-CONTAINER

on:
  workflow_call:
    inputs:
      WRT_CONF:
        description: '配置名 (Configs/<WRT_CONF>.yml)'
        required: true
        type: string
      WRT_REPO:
        description: '源码仓库，留空则从 Configs/<WRT_CONF>.yml 加载'
        default: ''
        required: false
        type: string
      WRT_BRANCH:
        description: '源码分支，留空则从 Configs/<WRT_CONF>.yml 加载'
        default: ''
        required: false
        type: string
      WRT_COMMIT:
        description: '指定源码Commit (留空使用最新)'
        default: ''
        required: false
        type: string
      WRT_CACHE:
        description: '使用Cache'
        default: false
        required: false
        type: boolean
      WRT_TAGCONF:
        description: 'Tag使用的Conf'
        default: false
        required: false
        type: boolean
      WRT_TEST:
        description: '仅生成Conf'
        default: false
        required: false
        type: boolean
      PATH_MOUNT:
        default: '/volume_mnt'
        required: false
        type: string

  workflow_dispatch:
    inputs:
      WRT_CONF:
        description: '配置名 (Configs/<WRT_CONF>.yml)'
        default: 'x86'
        required: true
        type: string
      WRT_REPO:
        description: '源码仓库（留空则从 Configs/<WRT_CONF>.yml 加载）'
        default: ''
        required: false
        type: string
      WRT_BRANCH:
        description: '源码分支（留空则从 Configs/<WRT_CONF>.yml 加载）'
        default: ''
        required: false
        type: string
      WRT_COMMIT:
        description: '指定源码Commit (留空使用最新)'
        default: ''
        required: false
        type: string
      WRT_CACHE:
        description: '使用Cache'
        default: false
        required: true
        type: boolean
      WRT_TAGCONF:
        description: 'Tag使用的Conf'
        default: false
        required: true
        type: boolean
      WRT_TEST:
        description: '仅生成Conf'
        default: false
        required: true
        type: boolean
      PATH_MOUNT:
        default: '/volume_mnt'
        required: true
        type: string

env:
  PATH_MOUNT: ${{inputs.PATH_MOUNT}}
  PATH_WORKDIR: ${{inputs.PATH_MOUNT}}/work
  PATH_CI: ci
  PATH_SRC: opwrt_src
  PATH_DIAGNOSTICS: ${{inputs.PATH_MOUNT}}/work/diagnostics

  WRT_CONF: ${{inputs.WRT_CONF}}
  WRT_TAGCONF: ${{inputs.WRT_TAGCONF}}
  WRT_REPO: ${{inputs.WRT_REPO}}
  WRT_BRANCH: ${{inputs.WRT_BRANCH}}
  WRT_COMMIT: ${{inputs.WRT_COMMIT}}
  WRT_TEST: ${{inputs.WRT_TEST}}
  WRT_CACHE: ${{inputs.WRT_CACHE}}

jobs:
  core:
    name: CONTAINER_${{inputs.WRT_CONF}}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    container:
      image: ubuntu:24.04
      volumes:
        - /mnt:${{inputs.PATH_MOUNT}}
      options: --env TZ=Asia/Shanghai
    defaults:
      run:
        shell: su ubuntu -c "bash --noprofile --norc -e -o pipefail {0}"
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Initialize System
        shell: bash
        run: |
          echo "=====Initializing System====="
          apt -yqq update
          apt -yqq install tzdata sudo git dos2unix curl python3 python3-yaml

          echo "Setting timezone to Asia/Shanghai..."
          ln -fs /usr/share/zoneinfo/Asia/Shanghai /etc/localtime
          dpkg-reconfigure --frontend noninteractive tzdata

          echo "Configuring ubuntu user..."
          id ubuntu >/dev/null 2>&1 || useradd -m -s /bin/bash ubuntu

          echo "Setting up work directory..."
          if [ -d "$PATH_WORKDIR" ]; then
            echo "Removing existing work directory..."
            rm -rf "$PATH_WORKDIR"
          fi
          mkdir -p "$PATH_WORKDIR" "$PATH_DIAGNOSTICS"
          chown -R ubuntu:ubuntu "$PATH_WORKDIR"
          echo "System initialization completed!"

      - name: Container Information
        run: |
          echo "========================================"
          echo "         CONTAINER INFORMATION"
          echo "========================================"
          echo "CPU: $(nproc) cores | $(lscpu | grep 'Model name' | cut -d':' -f2 | xargs)"
          echo "Memory: $(free -h | awk 'NR==2{printf "%s total, %s available", $2, $7}')"
          echo "Disk: $(df -h / | awk 'NR==2{printf "%s used / %s total (%s)", $3, $2, $5}')"
          echo ""
          echo "Build Configuration:"
          echo "- Config:         $WRT_CONF"
          echo "- Repo (input):   ${WRT_REPO:-'(will load from config file)'}"
          echo "- Branch (input): ${WRT_BRANCH:-'(will load from config file)'}"
          echo "- Commit:         ${WRT_COMMIT:-'latest'}"
          echo "- Test Mode:      $WRT_TEST"
          echo "- Cache:          $WRT_CACHE"
          echo "- Time:           $(date -Iseconds)"
          echo "========================================"

      - name: Checkout CI Code
        uses: actions/checkout@v6
        with:
          path: ${{env.PATH_CI}}

      - name: Load Config Defaults
        shell: bash
        run: |
          echo "=====Loading Config Defaults====="
          CONFIG_YML="$GITHUB_WORKSPACE/$PATH_CI/Configs/$WRT_CONF.yml"
          WRT_CFG="$GITHUB_WORKSPACE/$PATH_CI/Configs/wrt_cfg.py"

          # Save workflow inputs before loading config file
          INPUT_REPO="$WRT_REPO"
          INPUT_BRANCH="$WRT_BRANCH"
          CONF_REPO=""
          CONF_BRANCH=""

          if [ -f "$CONFIG_YML" ]; then
            echo "Loading config from Configs/$WRT_CONF.yml ..."
            CONF_REPO=$(python3 "$WRT_CFG" get "$CONFIG_YML" repo)
            CONF_BRANCH=$(python3 "$WRT_CFG" get "$CONFIG_YML" branch)
          else
            echo "No Configs/$WRT_CONF.yml found"
            echo "Available configs:"
            find "$GITHUB_WORKSPACE/$PATH_CI/Configs/" -maxdepth 1 -name "*.yml" -printf '%f\n' 2>/dev/null | sed 's/\.yml$//' | sort || echo "  (none)"
          fi

          # Workflow inputs take priority over config file values
          FINAL_REPO="${INPUT_REPO:-${CONF_REPO}}"
          FINAL_BRANCH="${INPUT_BRANCH:-${CONF_BRANCH}}"

          # Validate we have required values
          if [ -z "$FINAL_REPO" ]; then
            echo "ERROR: WRT_REPO not set. Provide it via workflow input or set 'repo' in Configs/$WRT_CONF.yml"
            exit 1
          fi
          if [ -z "$FINAL_BRANCH" ]; then
            echo "ERROR: WRT_BRANCH not set. Provide it via workflow input or set 'branch' in Configs/$WRT_CONF.yml"
            exit 1
          fi

          echo "WRT_REPO=$FINAL_REPO"   >> $GITHUB_ENV
          echo "WRT_BRANCH=$FINAL_BRANCH" >> $GITHUB_ENV
          echo "Effective repo:   $FINAL_REPO"
          echo "Effective branch: $FINAL_BRANCH"

      - name: Checkout Source Code
        uses: actions/checkout@v6
        with:
          repository: ${{env.WRT_REPO}}
          ref: ${{env.WRT_BRANCH}}
          path: ${{env.PATH_SRC}}
          fetch-depth: 0

      - name: Initialize Values
        shell: bash
        run: |
          echo "=====Initializing Build Values====="
          if [ $WRT_TAGCONF == true ]; then
            export WRT_TAG=$WRT_CONF'_'$(date -Iseconds)
            echo "Using configuration-based tag: $WRT_TAG"
          else
            export WRT_TAG='build_'$(date -Iseconds)
            echo "Using build-based tag: $WRT_TAG"
          fi
          echo "WRT_TAG=$WRT_TAG" >> $GITHUB_ENV

          export F_DATE=$(date +"%y%m%dT%H%M%S")
          export WRT_VER=$(echo $WRT_REPO | sed 's/\//-/g')'_'$WRT_BRANCH
          echo "F_DATE=$F_DATE"   >> $GITHUB_ENV
          echo "WRT_VER=$WRT_VER" >> $GITHUB_ENV
          echo "Build date:     $F_DATE"
          echo "Version string: $WRT_VER"

      - name: Check and Switch Source Code
        shell: bash
        run: |
          echo "=====Checking and Switching Source Code====="
          cd $GITHUB_WORKSPACE/$PATH_SRC

          echo "Current branch: $(git branch --show-current)"
          echo "Latest commit:  $(git log -1 --pretty=format:'%h - %s (%an, %ar)')"

          if [ -n "$WRT_COMMIT" ]; then
            echo "Switching to specified commit: $WRT_COMMIT"
            if git cat-file -e "$WRT_COMMIT^{commit}" 2>/dev/null; then
              git checkout "$WRT_COMMIT"
              echo "Successfully switched to commit: $WRT_COMMIT"
            else
              echo "ERROR: Commit '$WRT_COMMIT' not found in repository"
              echo "Available recent commits:"
              git log --oneline -10
              exit 1
            fi
          else
            echo "Using latest commit on branch $WRT_BRANCH"
          fi

          HASH=$(git log -1 --pretty=format:'%h')
          FULL_HASH=$(git log -1 --pretty=format:'%H')
          echo "WRT_HASH=$HASH"           >> $GITHUB_ENV
          echo "WRT_FULL_HASH=$FULL_HASH" >> $GITHUB_ENV

          echo ""
          echo "=== Final Source Code Information ==="
          echo "Commit:  $HASH ($FULL_HASH)"
          echo "Message: $(git log -1 --pretty=format:'%s')"
          echo "Author:  $(git log -1 --pretty=format:'%an <%ae>')"
          echo "Date:    $(git log -1 --pretty=format:'%cd')"
          echo "====================================="

      - name: Prepare Source Code
        shell: bash
        run: |
          echo "=====Preparing Source Code====="
          cp -a "$GITHUB_WORKSPACE/$PATH_CI" "$PATH_WORKDIR/$PATH_CI"
          cp -a "$GITHUB_WORKSPACE/$PATH_SRC" "$PATH_WORKDIR/$PATH_SRC"

          echo "Cleaning up GitHub workspace..."
          rm -rf "$GITHUB_WORKSPACE/$PATH_CI" "$GITHUB_WORKSPACE/$PATH_SRC"

          echo "Setting file permissions..."
          find "$PATH_WORKDIR/$PATH_CI" -type f \( -name '*.txt' -o -name '*.sh' \) -exec dos2unix {} +
          chown -R ubuntu:ubuntu "$PATH_WORKDIR"
          echo "Source code preparation completed!"

      # ── Hook 1: After code clone ─────────────────────────────────────────
      - name: Hook - After Clone
        run: |
          echo "=====Hook: After Clone====="
          CONFIG_YML="$PATH_WORKDIR/$PATH_CI/Configs/$WRT_CONF.yml"
          if [ -f "$CONFIG_YML" ]; then
            HOOK_SCRIPT=$(python3 "$PATH_WORKDIR/$PATH_CI/Configs/wrt_cfg.py" hook "$CONFIG_YML" after_clone)
            if [ -n "$HOOK_SCRIPT" ]; then
              echo "Running after_clone hook ..."
              HOOK_TMP=$(mktemp /tmp/hook_XXXXXX.sh)
              trap 'rm -f "$HOOK_TMP"' EXIT
              printf '#!/bin/bash\nset -e\nset -o pipefail\n%s\n' "$HOOK_SCRIPT" > "$HOOK_TMP"
              cd "$PATH_WORKDIR/$PATH_SRC"
              bash "$HOOK_TMP" 2>&1 | tee "$PATH_DIAGNOSTICS/hook-after_clone.log"
              echo "after_clone hook completed!"
            else
              echo "No after_clone hook defined (skipping)"
            fi
          else
            echo "No config file found (skipping)"
          fi

      - name: Initialize Build Environment
        shell: bash
        run: |
          echo "=====Initializing Build Environment====="
          # Run privileged setup directly as container root. Compile as ubuntu.
          # Pin the setup script independently of the selected firmware source.
          SETUP_REV=04a39ca00d2cd6895c84e1c0670bc719cbd8d9fb
          SETUP_SCRIPT="$PATH_DIAGNOSTICS/init_build_environment.sh"
          curl -fSL --retry 3 --connect-timeout 20 \
            "https://raw.githubusercontent.com/immortalwrt/build-scripts/$SETUP_REV/init_build_environment.sh" \
            -o "$SETUP_SCRIPT"
          bash "$SETUP_SCRIPT" 2>&1 | tee "$PATH_DIAGNOSTICS/build-environment.log"

          for tool in make gcc g++ git perl patch rsync unzip tar xz bzip2 python3 clang; do
            command -v "$tool" || { echo "::error::Missing build dependency: $tool"; exit 1; }
          done
          echo "Build environment initialized!"

      - name: Generate Cache Key
        if: ${{ env.WRT_CACHE == 'true' }}
        shell: bash
        run: |
          echo "=====Generating Cache Key====="
          cd $PATH_WORKDIR/$PATH_SRC
          WRT_CFG="$PATH_WORKDIR/$PATH_CI/Configs/wrt_cfg.py"
          CONFIG_YML="$PATH_WORKDIR/$PATH_CI/Configs/$WRT_CONF.yml"

          # Hash the config content from the YAML file, or the fallback .txt file
          if [ -f "$CONFIG_YML" ]; then
            CONFIG_HASH=$(python3 "$WRT_CFG" get "$CONFIG_YML" config | sha256sum | cut -c1-8)
          elif [ -f "$PATH_WORKDIR/$PATH_CI/Simple/Config/$WRT_CONF.txt" ]; then
            CONFIG_HASH=$(sha256sum "$PATH_WORKDIR/$PATH_CI/Simple/Config/$WRT_CONF.txt" | cut -c1-8)
          else
            CONFIG_HASH="00000000"
          fi

          CACHE_KEY="${WRT_VER}-${WRT_CONF}-${WRT_HASH}-${CONFIG_HASH}"
          echo "CACHE_KEY=$CACHE_KEY" >> $GITHUB_ENV

          echo "Cache key:   $CACHE_KEY"
          echo "- Version:   $WRT_VER"
          echo "- Config:    $WRT_CONF"
          echo "- Commit:    $WRT_HASH"
          echo "- Conf hash: $CONFIG_HASH"

      - name: Check Caches
        id: check-cache
        if: ${{ env.WRT_TEST != 'true' && env.WRT_CACHE == 'true' }}
        uses: actions/cache@v5
        with:
          key: ${{env.CACHE_KEY}}
          restore-keys: |
            ${{env.WRT_VER}}-${{env.WRT_CONF}}-${{env.WRT_HASH}}-
            ${{env.WRT_VER}}-${{env.WRT_CONF}}-
          path: |
            ${{env.PATH_WORKDIR}}/${{env.PATH_SRC}}/.ccache
            ${{env.PATH_WORKDIR}}/${{env.PATH_SRC}}/staging_dir/host*
            ${{env.PATH_WORKDIR}}/${{env.PATH_SRC}}/staging_dir/tool*
            ${{env.PATH_WORKDIR}}/${{env.PATH_SRC}}/staging_dir/target-*

      - name: Configure Build Cache
        if: ${{ env.WRT_TEST != 'true' && env.WRT_CACHE == 'true' }}
        shell: bash
        run: |
          echo "=====Configuring Build Cache====="
          cd $PATH_WORKDIR/$PATH_SRC

          export CCACHE_DIR="$PWD/.ccache"
          export CCACHE_COMPRESS="1"
          echo "CCACHE_DIR=$CCACHE_DIR"           >> $GITHUB_ENV
          echo "CCACHE_COMPRESS=$CCACHE_COMPRESS" >> $GITHUB_ENV

          if [ "${{ steps.check-cache.outputs.cache-hit }}" = "true" ]; then
            echo "Cache hit! Using optimized build strategy."
            echo "BUILD_STRATEGY=fast" >> $GITHUB_ENV
            ccache -s 2>/dev/null || echo "ccache statistics not available yet"
          else
            echo "Cache miss. Using standard build strategy."
            echo "BUILD_STRATEGY=standard" >> $GITHUB_ENV

            if [ "${{ github.event_name }}" = "schedule" ]; then
              echo "Scheduled build: cleaning up old caches..."
              export GH_TOKEN="${{ github.token }}"
              gh extension install actions/gh-actions-cache 2>/dev/null || true

              CACHE_LIST=$(gh actions-cache list --key "${{env.WRT_VER}}-${{env.WRT_CONF}}" --repo "${{ github.repository }}" --limit 10 2>/dev/null | tail -n +4 | cut -f 1 || echo "")
              for CACHE_KEY_TO_DELETE in $CACHE_LIST; do
                gh actions-cache delete "$CACHE_KEY_TO_DELETE" --repo "${{ github.repository }}" --confirm 2>/dev/null || true
              done
            fi
          fi

      - name: Add Custom Feeds
        run: |
          echo "=====Adding Custom Feeds====="
          cd $PATH_WORKDIR/$PATH_SRC

          CONFIG_YML="$PATH_WORKDIR/$PATH_CI/Configs/$WRT_CONF.yml"
          if [ -f "$CONFIG_YML" ]; then
            FEEDS_CONTENT=$(python3 "$PATH_WORKDIR/$PATH_CI/Configs/wrt_cfg.py" get "$CONFIG_YML" feeds)
            if [ -n "$FEEDS_CONTENT" ]; then
              printf '%s\n' "$FEEDS_CONTENT" >> feeds.conf.default
              echo "Custom feeds added from Configs/$WRT_CONF.yml"
            else
              echo "feeds is empty in config file, checking fallback..."
              if [ -f "$PATH_WORKDIR/$PATH_CI/Simple/Feeds/$WRT_CONF.txt" ]; then
                cat "$PATH_WORKDIR/$PATH_CI/Simple/Feeds/$WRT_CONF.txt" >> feeds.conf.default
                echo "Custom feeds added from Simple/Feeds/$WRT_CONF.txt (fallback)"
              else
                echo "No custom feeds found (skipping)"
              fi
            fi
          elif [ -f "$PATH_WORKDIR/$PATH_CI/Simple/Feeds/$WRT_CONF.txt" ]; then
            cat "$PATH_WORKDIR/$PATH_CI/Simple/Feeds/$WRT_CONF.txt" >> feeds.conf.default
            echo "Custom feeds added from Simple/Feeds/$WRT_CONF.txt (fallback)"
          else
            echo "No custom feeds found (skipping)"
          fi

          echo "Current feeds configuration:"
          cat feeds.conf.default

      # ── Hook 2: After adding feeds, before update ─────────────────────────
      - name: Hook - Before Feeds Update
        run: |
          echo "=====Hook: Before Feeds Update====="
          CONFIG_YML="$PATH_WORKDIR/$PATH_CI/Configs/$WRT_CONF.yml"
          if [ -f "$CONFIG_YML" ]; then
            HOOK_SCRIPT=$(python3 "$PATH_WORKDIR/$PATH_CI/Configs/wrt_cfg.py" hook "$CONFIG_YML" before_feeds_update)
            if [ -n "$HOOK_SCRIPT" ]; then
              echo "Running before_feeds_update hook ..."
              HOOK_TMP=$(mktemp /tmp/hook_XXXXXX.sh)
              trap 'rm -f "$HOOK_TMP"' EXIT
              printf '#!/bin/bash\nset -e\nset -o pipefail\n%s\n' "$HOOK_SCRIPT" > "$HOOK_TMP"
              cd "$PATH_WORKDIR/$PATH_SRC"
              bash "$HOOK_TMP" 2>&1 | tee "$PATH_DIAGNOSTICS/hook-before_feeds_update.log"
              echo "before_feeds_update hook completed!"
            else
              echo "No before_feeds_update hook defined (skipping)"
            fi
          else
            echo "No config file found (skipping)"
          fi

      - name: Update Feeds
        run: |
          echo "=====Updating Feeds====="
          cd $PATH_WORKDIR/$PATH_SRC
          ./scripts/feeds update -a 2>&1 | tee "$PATH_DIAGNOSTICS/feeds-update.log"
          echo "Feeds update completed!"

      # ── Hook 3: After update, before install ─────────────────────────────
      - name: Hook - After Feeds Update
        run: |
          echo "=====Hook: After Feeds Update====="
          CONFIG_YML="$PATH_WORKDIR/$PATH_CI/Configs/$WRT_CONF.yml"
          if [ -f "$CONFIG_YML" ]; then
            HOOK_SCRIPT=$(python3 "$PATH_WORKDIR/$PATH_CI/Configs/wrt_cfg.py" hook "$CONFIG_YML" after_feeds_update)
            if [ -n "$HOOK_SCRIPT" ]; then
              echo "Running after_feeds_update hook ..."
              HOOK_TMP=$(mktemp /tmp/hook_XXXXXX.sh)
              trap 'rm -f "$HOOK_TMP"' EXIT
              printf '#!/bin/bash\nset -e\nset -o pipefail\n%s\n' "$HOOK_SCRIPT" > "$HOOK_TMP"
              cd "$PATH_WORKDIR/$PATH_SRC"
              bash "$HOOK_TMP" 2>&1 | tee "$PATH_DIAGNOSTICS/hook-after_feeds_update.log"
              echo "after_feeds_update hook completed!"
            else
              echo "No after_feeds_update hook defined (skipping)"
            fi
          else
            echo "No config file found (skipping)"
          fi

      - name: Install Feeds
        run: |
          echo "=====Installing Feeds====="
          cd $PATH_WORKDIR/$PATH_SRC
          ./scripts/feeds install -a 2>&1 | tee "$PATH_DIAGNOSTICS/feeds-install.log"
          echo "Feeds install completed!"

      # ── Hook 4: After install ─────────────────────────────────────────────
      - name: Hook - After Feeds Install
        run: |
          echo "=====Hook: After Feeds Install====="
          CONFIG_YML="$PATH_WORKDIR/$PATH_CI/Configs/$WRT_CONF.yml"
          if [ -f "$CONFIG_YML" ]; then
            HOOK_SCRIPT=$(python3 "$PATH_WORKDIR/$PATH_CI/Configs/wrt_cfg.py" hook "$CONFIG_YML" after_feeds_install)
            if [ -n "$HOOK_SCRIPT" ]; then
              echo "Running after_feeds_install hook ..."
              HOOK_TMP=$(mktemp /tmp/hook_XXXXXX.sh)
              trap 'rm -f "$HOOK_TMP"' EXIT
              printf '#!/bin/bash\nset -e\nset -o pipefail\n%s\n' "$HOOK_SCRIPT" > "$HOOK_TMP"
              cd "$PATH_WORKDIR/$PATH_SRC"
              bash "$HOOK_TMP" 2>&1 | tee "$PATH_DIAGNOSTICS/hook-after_feeds_install.log"
              echo "after_feeds_install hook completed!"
            else
              echo "No after_feeds_install hook defined (skipping)"
            fi
          else
            echo "No config file found (skipping)"
          fi

      - name: Apply Config
        run: |
          echo "=====Applying Config====="
          cd $PATH_WORKDIR/$PATH_SRC
          WRT_CFG="$PATH_WORKDIR/$PATH_CI/Configs/wrt_cfg.py"
          CONFIG_YML="$PATH_WORKDIR/$PATH_CI/Configs/$WRT_CONF.yml"

          rm -rf ./tmp* ./.config*

          # Read config content: inline 'config' key in yml > Simple/Config/ fallback
          if [ -f "$CONFIG_YML" ]; then
            CONFIG_CONTENT=$(python3 "$WRT_CFG" get "$CONFIG_YML" config)
            if [ -n "$CONFIG_CONTENT" ]; then
              printf '%s\n' "$CONFIG_CONTENT" >> .config
              echo "Config applied from Configs/$WRT_CONF.yml (config key)"
            else
              echo "config key is empty in yml, checking fallback..."
              if [ -f "$PATH_WORKDIR/$PATH_CI/Simple/Config/$WRT_CONF.txt" ]; then
                cat "$PATH_WORKDIR/$PATH_CI/Simple/Config/$WRT_CONF.txt" >> .config
                echo "Config applied from Simple/Config/$WRT_CONF.txt (fallback)"
              else
                echo "::error::No config content found for '$WRT_CONF'"
                exit 1
              fi
            fi
          elif [ -f "$PATH_WORKDIR/$PATH_CI/Simple/Config/$WRT_CONF.txt" ]; then
            cat "$PATH_WORKDIR/$PATH_CI/Simple/Config/$WRT_CONF.txt" >> .config
            echo "Config applied from Simple/Config/$WRT_CONF.txt (fallback)"
          else
            echo "::error::No config content found for '$WRT_CONF'"
            exit 1
          fi

          echo "Generating default configuration..."
          cp .config "$PATH_DIAGNOSTICS/seed.config"
          make defconfig V=sc 2>&1 | tee "$PATH_DIAGNOSTICS/defconfig.log"
          echo "Config applied!"

      # ── Hook 5: Before compilation starts ────────────────────────────────
      - name: Hook - Before Compile
        run: |
          echo "=====Hook: Before Compile====="
          CONFIG_YML="$PATH_WORKDIR/$PATH_CI/Configs/$WRT_CONF.yml"
          if [ -f "$CONFIG_YML" ]; then
            HOOK_SCRIPT=$(python3 "$PATH_WORKDIR/$PATH_CI/Configs/wrt_cfg.py" hook "$CONFIG_YML" before_compile)
            if [ -n "$HOOK_SCRIPT" ]; then
              echo "Running before_compile hook ..."
              HOOK_TMP=$(mktemp /tmp/hook_XXXXXX.sh)
              trap 'rm -f "$HOOK_TMP"' EXIT
              printf '#!/bin/bash\nset -e\nset -o pipefail\n%s\n' "$HOOK_SCRIPT" > "$HOOK_TMP"
              cd "$PATH_WORKDIR/$PATH_SRC"
              bash "$HOOK_TMP" 2>&1 | tee "$PATH_DIAGNOSTICS/hook-before_compile.log"
              echo "before_compile hook completed!"
            else
              echo "No before_compile hook defined (skipping)"
            fi
          else
            echo "No config file found (skipping)"
          fi

      - name: Record Build Inputs and Check Prerequisites
        run: |
          cd "$PATH_WORKDIR/$PATH_SRC"
          cp .config "$PATH_DIAGNOSTICS/full.config"
          cp feeds.conf.default "$PATH_DIAGNOSTICS/feeds.conf.default"
          ./scripts/diffconfig.sh > "$PATH_DIAGNOSTICS/diff.config"
          {
            echo "CI commit: $GITHUB_SHA"
            echo "Source: $WRT_REPO $WRT_BRANCH $WRT_FULL_HASH"
            echo "Profile: $WRT_CONF"
            echo "Cache requested: $WRT_CACHE"
            echo "Container: ubuntu:24.04"
            cat /etc/os-release
            make --version
            gcc --version
            clang --version
            sha256sum "$PATH_DIAGNOSTICS/init_build_environment.sh" .config
            for feed in feeds/* custom_feeds/*; do
              if [ -d "$feed/.git" ] || [ -f "$feed/.git" ]; then
                echo "Feed: $feed"
                git -C "$feed" rev-parse HEAD
                git -C "$feed" remote -v
              fi
            done
          } > "$PATH_DIAGNOSTICS/build-inputs.txt"
          make -j 1 prereq V=sc 2>&1 | tee "$PATH_DIAGNOSTICS/prerequisites.log"

      - name: Download Packages
        if: env.WRT_TEST != 'true'
        run: |
          echo "=====Downloading Packages====="
          cd $PATH_WORKDIR/$PATH_SRC
          make -j $(($(nproc)+1)) download V=w 2>&1 | tee "$PATH_DIAGNOSTICS/download.log"
          echo "Package download completed!"

      - name: Compile Firmware
        if: env.WRT_TEST != 'true'
        id: compile
        continue-on-error: true
        run: |
          cd "$PATH_WORKDIR/$PATH_SRC"
          echo "Compilation started at: $(date -Iseconds)"
          make -j $(($(nproc)+1)) V=w 2>&1 | tee "$PATH_DIAGNOSTICS/compile.log"

      - name: Compile Firmware (Single-threaded for Error Analysis)
        if: env.WRT_TEST != 'true' && steps.compile.outcome == 'failure'
        id: compile-single
        run: |
          cd "$PATH_WORKDIR/$PATH_SRC"
          echo "Multi-threaded compilation failed; retrying with detailed logs..."
          make -j 1 V=sc 2>&1 | tee "$PATH_DIAGNOSTICS/compile-single.log"

      - name: Check Compilation Result
        if: env.WRT_TEST != 'true'
        env:
          PARALLEL_OUTCOME: ${{steps.compile.outcome}}
          SINGLE_OUTCOME: ${{steps.compile-single.outcome}}
        run: |
          if [ "$PARALLEL_OUTCOME" = "success" ] || [ "$SINGLE_OUTCOME" = "success" ]; then
            echo "Firmware compilation completed successfully."
          else
            echo "::error::Firmware compilation failed; see the diagnostics artifact."
            exit 1
          fi

      - name: Package Firmware
        run: |
          echo "=====Packaging Firmware====="
          cd $PATH_WORKDIR/$PATH_SRC && mkdir ./upload

          cp -f ./.config ./upload/config_"$WRT_VER"_"$WRT_CONF"_"$F_DATE".txt

          if [[ $WRT_TEST != 'true' ]]; then
            find ./bin/targets/ -iregex ".*\(json\|manifest\|packages\)$" -exec rm -rf {} +
            find ./bin/targets/ -type f -exec mv -f {} ./upload/ \;
            echo "Firmware files:"
            ls -la ./upload/
          else
            echo "Test mode: only configuration file will be uploaded."
          fi
          echo "Packaging completed!"

      - name: Upload Firmware
        uses: actions/upload-artifact@v7
        with:
          name: ${{env.WRT_VER}}_${{env.WRT_CONF}}_${{env.F_DATE}}${{env.WRT_COMMIT != '' && format('_commit-{0}', env.WRT_HASH) || ''}}
          path: ${{env.PATH_WORKDIR}}/${{env.PATH_SRC}}/upload/*
          if-no-files-found: error

      - name: Collect Build Diagnostics
        if: ${{ always() }}
        shell: bash
        run: |
          if [ -d "$PATH_DIAGNOSTICS" ]; then
            if [ -f "$PATH_WORKDIR/$PATH_SRC/.config" ]; then
              cp "$PATH_WORKDIR/$PATH_SRC/.config" "$PATH_DIAGNOSTICS/full.config"
            fi
            if [ -d "$PATH_WORKDIR/$PATH_SRC/logs" ]; then
              cp -a "$PATH_WORKDIR/$PATH_SRC/logs" "$PATH_DIAGNOSTICS/package-logs"
            fi
          fi

      - name: Upload Build Diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics_${{env.WRT_CONF}}_${{github.run_id}}_${{github.run_attempt}}
          path: ${{env.PATH_DIAGNOSTICS}}/
          if-no-files-found: warn
          retention-days: 90
