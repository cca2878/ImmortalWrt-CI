feeds: |
  src-git sbwml_mosdns https://github.com/sbwml/luci-app-mosdns.git;v5
  src-git nikki https://github.com/nikkinikki-org/OpenWrt-nikki.git;main
hooks:
  after_clone: ""
  before_feeds_update: |-
    mkdir -p custom_feeds/v2ray-geodata
    git clone https://github.com/sbwml/v2ray-geodata custom_feeds/v2ray-geodata
    echo "src-link local_feeds ../custom_feeds" >> feeds.conf.default
  after_feeds_update: ""
  after_feeds_install: |-
    ./scripts/feeds update sbwml_mosdns local_feeds
    ./scripts/feeds uninstall mosdns
    ./scripts/feeds install -f -p sbwml_mosdns mosdns luci-app-mosdns v2dat
    ./scripts/feeds install -f -p local_feeds v2ray-geoip v2ray-geosite
  before_compile: |-
    ./scripts/config --set-str CONFIG_VERSION_CODE "$WRT_TAG"
    make -j $(($(nproc)+1)) defconfig V=sc
