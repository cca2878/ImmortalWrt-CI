# Complete pinned feeds are written by before_feeds_update.
feeds: ""
hooks:
  after_clone: ""
  before_feeds_update: |
    # Replace defaults rather than append duplicate feed names.
    cat > feeds.conf.default <<'AP_FEEDS'
    # Feed commits used for the RE-CS-02 AP EROFS configuration.
    src-git packages https://github.com/immortalwrt/packages.git^8d50d4ea3f11eef6f8fcc889cd35ba6fcb530481
    src-git luci https://github.com/immortalwrt/luci.git^17f97c0bec190e18d4884ab8204f63c64981edd7
    src-git routing https://github.com/openwrt/routing.git^4b9891b9136259f93294a424507ed24c5e8c1cbd
    src-git telephony https://github.com/openwrt/telephony.git^5d68d53c160a325ea9d03fce393e051573bcc736
    src-git video https://github.com/openwrt/video.git^6917907d4d6c670cf85be525d23216595655061d
    AP_FEEDS
    cp feeds.conf.default feeds.conf
  after_feeds_update: ""
  after_feeds_install: |
    # The workflow runs install -a first. Replace those generated links with
    # the tested definition set before Kconfig is generated. This avoids
    # unrelated Qt5/squeezelite-custom dependency cycles in these feeds.
    ./scripts/feeds uninstall -a
    ./scripts/feeds install \
      abseil-cpp attr bluez cgi-io cryptsetup csstidy \
      curl cyrus-sasl db dbus expat gdbm \
      glib2 gnutls hwdata icu iperf3 kmod \
      krb5 libaio libedit libev libffi libgpiod \
      libical libidn2 libpam libsodium libssh libssh2 \
      libtasn1 libtirpc libusb-compat linenoise lm-sensors luasrcdiet \
      luci luci-app-firewall luci-app-lldpd luci-app-package-manager luci-app-usteer luci-base \
      luci-lib-uqr luci-light luci-mod-admin-full luci-mod-network luci-mod-status luci-mod-system \
      luci-proto-ipv6 luci-proto-ppp luci-theme-argon luci-theme-bootstrap lucihttp lvm2 \
      net-snmp nghttp2 nghttp3 ngtcp2 openldap p11-kit \
      pciutils perl protobuf protobuf-c python-build python-flit-core \
      python-installer python-packaging python-pyproject-hooks python-setuptools python-wheel python3 \
      rpcd-mod-luci rpcd-mod-rrdns sqlite3 ucode-mod-html unbound usteer \
      wget xz zstd
  before_compile: |
    python3 - <<'PYCONF'
    from pathlib import Path
    import re
    import sys

    # Validate effective settings after the workflow runs make defconfig.
    required = {
        'CONFIG_TARGET_qualcommax': 'y',
        'CONFIG_TARGET_qualcommax_ipq60xx': 'y',
        'CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_jdcloud_re-cs-02': 'y',
        'CONFIG_TOOLCHAINOPTS': 'y',
        'CONFIG_GCC_USE_VERSION_15': 'y',
        'CONFIG_GCC_VERSION': '"15.3.0"',
        'CONFIG_BINUTILS_USE_VERSION_2_46': 'y',
        'CONFIG_BINUTILS_VERSION': '"2.46.1"',
        'CONFIG_CCACHE': 'y',
        'CONFIG_INCLUDE_CONFIG': 'y',
        'CONFIG_TARGET_OPTIMIZATION': '"-O2 -pipe -mcpu=cortex-a53"',
        'CONFIG_KERNEL_CC_OPTIMIZE_FOR_PERFORMANCE': 'y',
        'CONFIG_TARGET_ROOTFS_EROFS': 'y',
        'CONFIG_TARGET_ROOTFS_SQUASHFS': 'n',
        'CONFIG_TARGET_ROOTFS_EXT4FS': 'n',
        'CONFIG_TARGET_EROFS_PCLUSTER_SIZE': '256',
        'CONFIG_KERNEL_EROFS_FS': 'y',
        'CONFIG_TARGET_ROOTFS_INITRAMFS': 'y',
        'CONFIG_TARGET_INITRAMFS_COMPRESSION_ZSTD': 'y',
        'CONFIG_TARGET_ROOTFS_PERSIST_VAR': 'n',
        'CONFIG_ATH11K_NSS_SUPPORT': 'y',
        'CONFIG_ATH11K_THERMAL': 'y',
        'CONFIG_WPA_MBO_SUPPORT': 'y',
        'CONFIG_KERNEL_SKB_RECYCLER': 'y',
        'CONFIG_KERNEL_SKB_RECYCLER_MULTI_CPU': 'y',
        'CONFIG_KERNEL_SKB_RECYCLER_PREALLOC': 'n',
        'CONFIG_LUCI_LANG_zh_Hans': 'y',
        'CONFIG_PKG_ASLR_PIE_REGULAR': 'y',
        'CONFIG_PKG_CC_STACKPROTECTOR_REGULAR': 'y',
        'CONFIG_KERNEL_CC_STACKPROTECTOR_REGULAR': 'y',
        'CONFIG_PKG_FORTIFY_SOURCE_1': 'y',
        'CONFIG_PKG_RELRO_FULL': 'y',
        'CONFIG_PKG_DT_RELR': 'y',
        'CONFIG_USE_LTO': 'n',
        'CONFIG_USE_GC_SECTIONS': 'n',
        'CONFIG_USE_MOLD': 'n',
        'CONFIG_GCC_USE_GRAPHITE': 'n',
    }
    for package in (
        'fstools', 'block-mount', 'kmod-fs-f2fs', 'f2fs-tools', 'losetup',
        'uboot-envtools', 'ath11k-firmware-ipq6018-ddwrt',
        'ath11k-firmware-qcn9074-ddwrt', 'ipq-wifi-jdcloud_re-cs-02',
        'kmod-ath11k-ahb', 'kmod-ath11k-pci', 'wpad-openssl',
        'kmod-qca-nss-drv', 'kmod-qca-nss-dp', 'kmod-qca-nss-ecm',
        'kmod-qca-ssdk', 'kmod-qca-nss-drv-bridge-mgr',
        'kmod-qca-nss-drv-vlan-mgr', 'kmod-qca-nss-drv-wifi-meshmgr',
        'luci-mod-admin-full', 'luci-theme-argon', 'luci-i18n-base-zh-cn',
        'uhttpd', 'uhttpd-mod-ubus', 'libustream-openssl', 'openssl-util',
        'dropbear', 'luci-app-athena-led', 'ethtool', 'ip-bridge', 'ip-full',
        'map', 'odhcp6c', 'luci-proto-ipv6', 'kmod-ip6-tunnel',
        'kmod-iptunnel6', 'kmod-nat46', 'firewall4', 'nftables-json',
        'iptables-nft', 'iptables-mod-conntrack-extra', 'luci-app-firewall',
        'luci-i18n-firewall-zh-cn', 'iperf3', 'tcpdump-mini', 'usteer',
        'luci-app-usteer', 'luci-i18n-usteer-zh-cn', 'lldpd',
        'luci-app-lldpd', 'luci-i18n-lldpd-zh-cn',
    ):
        required['CONFIG_PACKAGE_' + package] = 'y'
    for package in (
        'dnsmasq', 'dnsmasq-full', 'odhcpd', 'odhcpd-ipv6only', 'ppp',
        'ppp-mod-pppoe', 'luci', 'luci-light', 'luci-theme-bootstrap',
        'luci-app-package-manager', 'default-settings', 'default-settings-chn',
        'docker', 'dockerd', 'containerd', 'mosdns', 'nikki',
        'dawn', 'irqbalance', 'sqm-scripts', 'miniupnpd-nftables',
        'fullconenat-sonic', 'luci-app-fullconenat-sonic',
        'luci-i18n-fullconenat-sonic-zh-cn',
    ):
        required['CONFIG_PACKAGE_' + package] = 'n'

    actual = {}
    for line in Path('.config').read_text().splitlines():
        if line.startswith('CONFIG_') and '=' in line:
            key, value = line.split('=', 1)
            actual[key] = value
    errors = []
    for key, expected in required.items():
        value = actual.get(key, 'n')
        if value != expected:
            errors.append(f'{key}: expected {expected}, got {value}')
    for key, value in actual.items():
        if key.startswith('CONFIG_PACKAGE_') and value == 'm':
            errors.append(f'{key}: expected packages built into the image, got m')
    if errors:
        for error in errors:
            print(f'::error::{error}', file=sys.stderr)
        sys.exit(1)
    known = set(re.findall(r'^Package: (\S+)', Path('tmp/.packageinfo').read_text(), re.M))
    selected = [name for name in known if actual.get('CONFIG_PACKAGE_' + name) == 'y']
    print(f'RE-CS-02 AP profile checks passed: {len(required)} settings, {len(selected)} packages.')
    print('Network, US country, SSID, roaming and MAP-E provider settings must be configured after flashing.')
    PYCONF
