# Install as Configs/re_cs_02_ap.yml and select WRT_CONF=re_cs_02_ap.
# branch is a checkout ref: pin the tested main commit for reproducibility.
# No custom network/WiFi/US country/ISP defaults are embedded.
repo: VIKINGYFY/immortalwrt
branch: "f9b0ce7650fdcc7f4793256a3ae43c1132e2bc49"

